<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Unity-style 2D Editor</title>
<style>
:root{--bg:#383838;--p:#2d2d2d;--b:#1a1a1a;--t:#ddd;--a:#2c5d87;--i:#515151;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font:12px "Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
body{display:flex;flex-direction:column}
#app{--lw:235px;--rw:290px;--bh:170px;display:grid;flex:1;min-height:0;grid-template-columns:var(--lw) 5px minmax(80px,1fr) 5px var(--rw);grid-template-rows:minmax(80px,1fr) 5px var(--bh)}
#p1{grid-area:1/1}#sv{grid-area:1/3}#p3{grid-area:1/5}#proj{grid-area:3/1/4/6}
.sp{background:#1a1a1a;z-index:2}.sp:hover,.sp.d{background:var(--a)}.sp.v{cursor:col-resize}.sp.h{cursor:row-resize}
.pn{background:var(--p);border:1px solid var(--b);display:flex;flex-direction:column;min-height:0;min-width:0}
.ph{background:#3c3c3c;padding:4px 8px;border-bottom:1px solid var(--b);display:flex;justify-content:space-between;align-items:center}
.pb{flex:1;overflow:auto;min-height:0;position:relative}

.it{padding:3px 10px;cursor:default}.it:hover{background:#3a3a3a}.it.s{background:var(--a)}
#cv{width:100%;height:100%;display:block}
.sec{border-bottom:1px solid var(--b);padding:6px 8px}.sh{font-weight:600;margin-bottom:6px;display:flex;justify-content:space-between}
.r{display:flex;align-items:center;gap:4px;margin:3px 0}.l{width:80px;flex:none}
.f{display:flex;flex:1;align-items:center;background:var(--i);border-radius:2px;min-width:0}
.f i{font-style:normal;padding:2px 6px;cursor:ew-resize;color:#aaa}
input[type=number],input[type=text]{background:#2a2a2a;color:var(--t);border:1px solid #111;border-radius:2px;padding:2px 4px;width:100%;box-sizing:border-box;min-width:0}
.f input{background:transparent;border:0}
input[type=range]{flex:1}input[type=color]{width:60px;height:20px;border:0;padding:0;background:none}
.slot{flex:1;background:#2a2a2a;border:1px solid #111;padding:2px 6px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.o{outline:1px solid #5aa0e0}
button{background:#585858;color:var(--t);border:1px solid #111;border-radius:3px;padding:3px 10px;cursor:pointer}button:hover{background:#666}
#menu{position:fixed;background:#2b2b2b;border:1px solid #111;box-shadow:0 4px 12px #000a;padding:2px 0;display:none;z-index:9;min-width:150px}
#menu div{padding:4px 18px}#menu div:hover{background:var(--a)}
.e{padding:12px;color:#888}
#ac{width:100%;height:100%;display:block}
#ap{position:absolute;left:8px;top:8px;width:230px;background:#2d2df0;background:#2d2d2dee;border:1px solid #111;padding:6px}
.tb{background:#3c3c3c;border:0;border-bottom:2px solid transparent;border-radius:0;padding:2px 10px}.tb.on{border-bottom-color:var(--a);background:#4a4a4a}
select{background:#2a2a2a;color:var(--t);border:1px solid #111;max-width:95px}
</style><link rel="stylesheet" href="project.css"></head><body>
<div id="mbar"><button class="mb" data-m="file">File</button><button class="mb" data-m="edit">Edit</button><span class="mgrow"></span><span id="pname" title="Папка проекта"></span><button id="msave" title="Сохранить всё (Ctrl+S)">💾 Save</button></div>
<div id="app">
<div class="pn" id="p1"><div class="ph">Hierarchy</div><div class="pb" id="hier"></div></div>
<div class="pn" id="sv"><div class="ph"><span><button class="tb on" data-tab="scene">Scene</button> <button class="tb" data-tab="anim">Animator</button> <button class="tb" data-tab="clip">Animation</button> <button id="play-btn" title="Play / Stop (Ctrl+P)">▶ Play</button><button id="pause-btn" title="Пауза / продолжить" disabled>⏸</button></span><span id="hint" style="color:#999">ПКМ — создать · колесо — зум · СКМ/Alt — пан · Shift при масштабе — пропорции</span></div><div class="pb" id="scn"><canvas id="cv"></canvas></div><div class="pb" id="ant" style="display:none"><canvas id="ac"></canvas><div id="ap"></div><div id="apw"><div class="apt">Preview · колесо — зум, ЛКМ — пан</div><canvas id="apv"></canvas></div></div>

<div id="anm" style="display:none">
<div id="tl-bar">
<div class="grp"><span class="bi" title="Анимация (клип)">▤</span><select id="tl-sel" title="Анимация (клип)"></select><input type="text" id="tl-name" placeholder="Имя клипа" title="Имя клипа"></div>
<div class="grp"><button id="tl-first" class="ib" title="В начало (время 0)">⏮</button><button id="tl-pk" class="ib" title="К предыдущему ключу">◂◆</button><button id="tl-pl" class="ib" title="Проиграть / остановить (Space)">▶</button><button id="tl-nk" class="ib" title="К следующему ключу">◆▸</button><button id="tl-last" class="ib" title="В конец (последний ключ)">⏭</button></div>
<div class="grp"><button id="tl-rec" title="Режим записи: изменения в Inspector и на сцене автоматически ставят ключи">● Rec</button><button id="tl-key" title="Поставить ключи в текущем кадре (для выбранных строк / объекта / всех)">◆ Key</button><button id="tl-add" title="Добавить свойство выбранного объекта">＋ Property ▾</button><button id="tl-del" class="ib" title="Удалить выделенные ключи (Del)">⌫</button></div>
<div class="grp"><label title="Текущее время, секунды">⏱ <input type="number" id="tl-t" step="0.01" min="0"></label><span id="tl-f"></span></div>
<div class="grp"><span class="lb" title="Длина клипа = время последнего ключа (считается автоматически)">↔ Длина</span><b id="tl-len">—</b><label title="Кадров в секунду">FPS <input type="number" id="tl-fps" step="1" min="1" max="240"></label><label title="Зациклить анимацию"><input type="checkbox" id="tl-loop"> ↻ Loop</label><label title="Сколько кадров между соседними спрайтами при перетаскивании из Project на таймлайн">▣ Шаг <input type="number" id="tr-step" step="1" min="1" max="240" value="1"></label></div>
<span class="grow"></span>
<div class="grp"><button id="tl-fit" class="ib" title="Вписать клип в окно">⤢</button><button id="tl-max" class="ib" title="Развернуть / свернуть окно анимации">⛶</button></div>
</div>
<div id="tl-body"><div id="tl-lw"><div id="tl-lh">☰ Properties</div><div id="tl-lc"><div id="tl-list"></div></div></div>
<div id="tl-cv"><canvas id="tlc"></canvas><div id="tl-empty"><div>Нет анимаций</div><div class="sub">Список анимаций слева вверху → «＋ Create New Clip…»</div></div></div></div>
</div></div>
<div class="pn" id="p3"><div class="ph">Inspector</div><div class="pb" id="ins"></div></div>
<div class="sp v" id="s1" style="grid-area:1/2"></div><div class="sp v" id="s2" style="grid-area:1/4"></div><div class="sp h" id="s3" style="grid-area:2/1/3/6"></div>
<div class="pn" id="proj"><div class="ph"><b>Project</b><span class="ptools"><input type="text" id="psearch" placeholder="Поиск…"><input type="range" id="pzoom" min="40" max="128" value="64" title="Размер иконок"><button id="pnew">+ Create ▾</button><button id="imp">Import…</button></span></div>
<div id="pbody"><div id="ptree"></div><div class="sp v" id="s4"></div><div id="pmain"><div id="pcrumb"></div><div id="pgrid"></div></div></div></div>
</div>
<div id="hub" style="display:none"></div><div id="dlg" style="display:none"></div><div id="toast"></div>
<div id="menu"></div><input type="file" id="file" accept="image/*,.otf,.ttf,.woff,.woff2" multiple hidden>
<script>
const $=s=>document.querySelector(s),PPU=100,TAU=Math.PI/180,imgCache=new Map();   // imgCache: url -> Image/Canvas (нужен для Undo и загрузки проекта)
let objs=[],assets=[],sel=null,nid=1,aid=1,cam={x:0,y:0,z:100},pan=null,drag=null,tc={};
const cv=$('#cv'),g=cv.getContext('2d'),menu=$('#menu'),ins=$('#ins');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// get(): Map id -> {объект, индекс}; сам проверяет актуальность (objs часто пересоздаётся/фильтруется), O(1) вместо O(n)
let gmap=null,garr=null,glen=-1;
const gbuild=()=>{gmap=new Map();garr=objs;glen=objs.length;for(let i=0;i<objs.length;i++)gmap.set(objs[i].id,i)};
const get=id=>{if(id==null)return undefined;if(garr!==objs||glen!==objs.length)gbuild();
  let i=gmap.get(+id);if(i!==undefined&&objs[i]&&objs[i].id==id)return objs[i];
  if(i===undefined&&gmap.size===objs.length){gbuild();i=gmap.get(+id);return i!==undefined?objs[i]:undefined}   // возможно, объект подменили при той же длине
  gbuild();i=gmap.get(+id);return i!==undefined?objs[i]:undefined},ast=id=>assets.find(a=>a.id==id),isFont=id=>{const a=ast(id);return !!(a&&a.font)};
const rd=v=>Math.round(v*1000)/1000;
// доступ к анимируемым свойствам (x,y,r,sx,sy | color,alpha,sprite) и единая точка изменения (для Animation Rec)
const gim=o=>o.img||o.text||o.grad;   // у Image и Text есть общие color / alpha
const pget=(o,k)=>k=='sprite'?(o.img?o.img.sprite:undefined):k=='color'||k=='alpha'?(gim(o)?gim(o)[k]:undefined):(k=='rx'||k=='ry')?(o[k]||0):o[k];
const pset=(o,k,v)=>{if(k=='sprite'){if(o.img)o.img.sprite=v}else if(k=='color'||k=='alpha'){if(gim(o))gim(o)[k]=v}else o[k]=v};
function chg(o,k,v){const old=pget(o,k);pset(o,k,v);window.animEdit&&animEdit(o,k,old,v)}
function mkAsset(name,url,folder){return new Promise(r=>{const img=new Image();img.onload=()=>{imgCache.set(url,img);const fo=folder==null?(window.curFolder?curFolder():0):folder;const a={id:aid++,name:window.uniqAsset?uniqAsset(name,fo):name,url,img,folder:fo,ppu:PPU,mode:'single',sprites:[]};assets.push(a);r(a)};img.src=url})}
function gen(name,fn,folder){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle='#fff';x.beginPath();fn(x);x.fill();return mkAsset(name,c.toDataURL(),folder)}
// ---- menu
function showMenu(x,y,items){menu.innerHTML='';items.forEach(([t,fn])=>{const d=document.createElement('div');d.textContent=t;d.onclick=()=>{menu.style.display='none';fn()};menu.append(d)});menu.style.display='block';menu.style.left=Math.min(x,innerWidth-170)+'px';menu.style.top=Math.min(y,innerHeight-items.length*26-10)+'px'}
addEventListener('mousedown',e=>{if(!menu.contains(e.target))menu.style.display='none'},true);
// ---- objects
function add(name,w,img,parent,text,grad){const L=parent!=null?toLocal({parent},w.x,w.y):{x:w.x,y:w.y};
  const o={id:nid++,name,x:rd(L.x),y:rd(L.y),r:0,rx:0,ry:0,sx:1,sy:1,img:img||null};if(text)o.text=text;if(grad)o.grad=grad;if(parent!=null){o.parent=parent;hcol.delete(parent)}
  objs.push(o);sel=o.id;refresh();return o}
const newImg=s=>({sprite:s||null,color:'#ffffff',alpha:1});
function del(id){const gone=new Set(subtree(id).map(o=>o.id));objs=objs.filter(o=>!gone.has(o.id));if(gone.has(sel))sel=null;refresh()}
function dup(id){const o=get(id);if(!o)return;const src=subtree(id).sort((a,b)=>objs.indexOf(a)-objs.indexOf(b)),map=new Map();
  const cp=src.map(s=>{const c=JSON.parse(JSON.stringify(s));c.id=nid++;map.set(s.id,c.id);return c});
  cp.forEach((c,i)=>{if(src[i].id==id){c.name=o.name+' (1)';c.x=rd(c.x+.3);c.y=rd(c.y-.3)}else c.parent=map.get(src[i].parent)});
  objs.push(...cp);sel=map.get(id);refresh()}
function size(o,im){if(o.screen)return[o.screen.w/PPU,o.screen.h/PPU];im=im||o.img;if(!o.img&&!o.text&&o.grad)return[Math.max(.01,o.grad.w),Math.max(.01,o.grad.h)];if(!o.img&&o.text)return[Math.max(.01,o.text.w),Math.max(.01,o.text.h)];const a=im&&im.sprite&&ast(im.sprite);return a&&a.img?[a.img.width/ppuOf(a),a.img.height/ppuOf(a)]:im?[1,1]:[.3,.3]}

/* ---- иерархия: x,y,r,sx,sy — ЛОКАЛЬНЫЕ (относительно родителя), мировая матрица считается на лету ---- */
// матрица [a,b,c,d,e,f]: X=a*x+c*y+e ; Y=b*x+d*y+f
const locM=o=>{const c=Math.cos(o.r*TAU),s=Math.sin(o.r*TAU),rx=(o.rx||0)*TAU,ry=(o.ry||0)*TAU,cx=Math.cos(rx),cy=Math.cos(ry),k=Math.sin(rx)*Math.sin(ry);
  // Rotation X/Y в 2D — проекция на плоскость сцены: колонки (cosY, sinX·sinY) и (0, cosX), затем поворот Z
  return[c*cy*o.sx-s*k*o.sx,s*cy*o.sx+c*k*o.sx,-s*cx*o.sy,c*cx*o.sy,o.x,o.y]};
const mulM=(P,L)=>[P[0]*L[0]+P[2]*L[1],P[1]*L[0]+P[3]*L[1],P[0]*L[2]+P[2]*L[3],P[1]*L[2]+P[3]*L[3],P[0]*L[4]+P[2]*L[5]+P[4],P[1]*L[4]+P[3]*L[5]+P[5]];
const invM=M=>{const det=M[0]*M[3]-M[1]*M[2];if(Math.abs(det)<1e-12)return null;const a=M[3]/det,b=-M[1]/det,c=-M[2]/det,d=M[0]/det;return[a,b,c,d,-(a*M[4]+c*M[5]),-(b*M[4]+d*M[5])]};
const apM=(M,x,y)=>({x:M[0]*x+M[2]*y+M[4],y:M[1]*x+M[3]*y+M[5]});
function wmat(o,dep){dep=dep||0;const p=o.parent!=null&&dep<64?get(o.parent):null;return p?mulM(wmat(p,dep+1),locM(o)):locM(o)}
const worldPos=o=>{const M=wmat(o);return{x:M[4],y:M[5]}};
// мировая точка -> локальные координаты объекта o (по его родителю)
function toLocal(o,wx,wy){const p=o.parent!=null?get(o.parent):null;if(!p)return{x:wx,y:wy};const I=invM(wmat(p));return I?apM(I,wx,wy):{x:wx,y:wy}}
function decomp(M,rx,ry,fb){rx=(rx||0)*TAU;ry=(ry||0)*TAU;fb=fb||{};
  const cx=Math.cos(rx),cy=Math.cos(ry),k=Math.sin(rx)*Math.sin(ry),ql=Math.hypot(cy,k),det=M[0]*M[3]-M[1]*M[2];
  if(ql<1e-6)return{x:M[4],y:M[5],r:fb.r||0,sx:fb.sx==null?1:fb.sx,sy:fb.sy==null?1:fb.sy};
  const sx=Math.hypot(M[0],M[1])/ql,r=(Math.atan2(M[1],M[0])-Math.atan2(k,cy))/TAU,d=sx*cy*cx;
  return{x:M[4],y:M[5],r,sx,sy:Math.abs(d)>1e-9?det/d:Math.hypot(M[2],M[3])/Math.max(Math.abs(cx),1e-6)}}
// порядок обхода (родитель, затем дети): [{o,d,on}] — on=false, если сам объект или любой родитель выключен
function order(){const ch=new Map(),out=[],seen=new Set();
  for(const o of objs){const p=o.parent!=null&&get(o.parent)?o.parent:null;let a=ch.get(p);if(!a)ch.set(p,a=[]);a.push(o)}
  const walk=(o,d,act,PM)=>{if(seen.has(o.id))return;seen.add(o.id);const on=act&&o.active!==false,M=PM?mulM(PM,locM(o)):locM(o);out.push({o,d,on,M});const k=ch.get(o.id);if(k)for(const c of k)walk(c,d+1,on,M)};
  const r=ch.get(null);if(r)for(const o of r)walk(o,0,true,null);return out}
function subtree(id){const kids=new Map();for(const c of objs)if(c.parent!=null){let a=kids.get(c.parent);if(!a)kids.set(c.parent,a=[]);a.push(c.id)}
  const r=[],st=[id],seen=new Set();while(st.length){const i=st.pop();if(seen.has(i))continue;seen.add(i);const o=get(i);if(!o)continue;r.push(o);const k=kids.get(i);if(k)for(const x of k)st.push(x)}return r}
const canParent=(id,pid)=>pid==null||!subtree(id).some(o=>o.id==pid);
// Create Empty Parent: пустой объект в позиции o, на том же месте среди соседей; o становится его дочерним (мировая трансформация o не меняется)
function emptyParent(id){const o=get(id);if(!o)return null;
  const g={id:nid++,name:'GameObject',x:o.x,y:o.y,r:0,rx:0,ry:0,sx:1,sy:1,img:null};
  if(o.parent!=null)g.parent=o.parent;
  objs.splice(objs.indexOf(o),0,g);reparent(o,g.id);hcol.delete(g.id);sel=g.id;refresh();return g}
// Rename: имя объекта правится прямо в строке Hierarchy (Enter — применить, Esc — отмена)
function renameObj(id){const o=get(id);if(!o)return;
  for(let p=o.parent!=null?get(o.parent):null,g=0;p&&g<64;g++,p=p.parent!=null?get(p.parent):null)hcol.delete(p.id);   // раскрыть родителей, чтобы строка была видна
  hier();const row=$('#hier').querySelector(`.it[data-id="${id}"]`);if(!row)return;
  row.scrollIntoView({block:'nearest'});
  const inp=document.createElement('input');inp.type='text';inp.className='rn';inp.value=o.name;
  const tn=row.querySelector('.nm');row.draggable=false;if(tn)tn.replaceWith(inp);else row.appendChild(inp);
  inp.focus();inp.select();let done=0;
  const fin=ok=>{if(done)return;done=1;if(ok){const v=inp.value.trim();if(v&&v!=o.name)o.name=v}refresh()};
  inp.onkeydown=e=>{e.stopPropagation();if(e.key=='Enter')fin(1);if(e.key=='Escape')fin(0)};
  inp.onblur=()=>fin(1);inp.onmousedown=inp.onclick=inp.ondblclick=e=>e.stopPropagation()}
// сделать o дочерним к pid (null — в корень), мировая позиция/поворот/масштаб сохраняются
function reparent(o,pid){
  if(!canParent(o.id,pid))return false;
  const M=wmat(o),np=pid!=null?get(pid):null,I=np?invM(wmat(np)):null,L=I?mulM(I,M):M,d=decomp(L,o.rx,o.ry,o);
  if(pid==null)delete o.parent;else o.parent=pid;
  o.x=rd(d.x);o.y=rd(d.y);o.r=rd(d.r);o.sx=rd(d.sx);o.sy=rd(d.sy);return true}
// pid — новый родитель; ref+pos('before'|'after') — позиция среди соседей, иначе в конец
function moveObj(o,pid,ref,pos){
  if(!reparent(o,pid))return;
  objs=objs.filter(x=>x!==o);
  if(ref){const i=objs.indexOf(ref);objs.splice(pos=='after'?i+1:i,0,o)}else objs.push(o);
  if(pid!=null)hcol.delete(pid);sel=o.id;refresh()}
function toW(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left-r.width/2)/cam.z+cam.x,y:-(e.clientY-r.top-r.height/2)/cam.z+cam.y}}
function hit(w,scr){const L=order();for(let i=L.length-1;i>=0;i--){const{o,on,M}=L[i];if(!on||!o.screen!==!scr)continue;const I=invM(M);if(!I)continue;const p=apM(I,w.x,w.y),[sw,sh]=size(o);if(Math.abs(p.x)<=sw/2&&Math.abs(p.y)<=sh/2)return o}return scr?null:hit(w,true)}
// ---- draw
let tcN=0;
function tint(a,col){if(col=='#ffffff')return a.img;const k=a.id+col;if(tc[k])return tc[k];if(++tcN>96){for(const q in tc)delete tc[q];tcN=1}const c=document.createElement('canvas');c.width=a.img.width;c.height=a.img.height;const x=c.getContext('2d');x.drawImage(a.img,0,0);x.globalCompositeOperation='multiply';x.fillStyle=col;x.fillRect(0,0,c.width,c.height);x.globalCompositeOperation='destination-in';x.drawImage(a.img,0,0);return tc[k]=c}
// draw() только ставит кадр в очередь (десятки вызовов за событие = одна перерисовка); drawNow() — немедленно
let dq=0;
function draw(){if(dq)return;dq=requestAnimationFrame(()=>{dq=0;drawNow()})}
function drawNow(){if(dq){cancelAnimationFrame(dq);dq=0}
  const W=cv.clientWidth,H=cv.clientHeight,d=devicePixelRatio||1;if(cv.width!=Math.round(W*d)||cv.height!=Math.round(H*d)){cv.width=Math.round(W*d);cv.height=Math.round(H*d)}
